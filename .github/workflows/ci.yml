name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_BUILD_CONSTRAINT: build-constraints.txt
      UV_REQUIRE_HASHES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --extra mke
      - name: Run hermetic A4 CLI contracts (provider-free)
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run pytest -p no:cacheprovider -o addopts= -q \
            tests/unit/evidence_loop/test_cli_contracts.py::test_development_cli_accepts_a_fresh_external_run_root_without_retained_artifacts \
            tests/unit/evidence_loop/test_cli_contracts.py::test_development_cli_persists_each_terminal_disposition \
            tests/unit/evidence_loop/test_cli_contracts.py::test_development_cli_completes_the_a4_failure_taxonomy
      - run: uv lock --check
      - run: uv run pytest -q -m "not database and not mke"
      - run: make dra-check
      - run: make collaboration-check
      - run: make skills-check
      - run: scripts/run_mke_lane.sh test tests/integration/adapters/test_mke_readonly_smoke.py
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build --build-constraints build-constraints.txt --require-hashes
      - run: uv run python scripts/verify_release.py --tree-mode release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  compose_db:
    name: compose / db-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: night-voyager-ci-${{ github.run_id }}-${{ github.run_attempt }}-compose-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make db-check
      - if: always()
        run: make down

  compose_collaboration_authority:
    name: compose / collaboration-authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: night-voyager-ci-${{ github.run_id }}-${{ github.run_attempt }}-compose-collaboration-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make collaboration-db-check SUITE=authority
      - if: always()
        run: make down

  compose_proof:
    name: compose / proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: night-voyager-ci-${{ github.run_id }}-${{ github.run_attempt }}-compose-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make compose-proof
      - if: always()
        run: make down

  compose:
    name: compose
    needs:
      - compose_db
      - compose_collaboration_authority
      - compose_proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every compose gate
        run: |
          test "${{ needs.compose_db.result }}" = success
          test "${{ needs.compose_collaboration_authority.result }}" = success
          test "${{ needs.compose_proof.result }}" = success
